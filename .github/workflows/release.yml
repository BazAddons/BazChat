name: Package and Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Uploads straight to CurseForge with CF_API_KEY, the same as the
      # rest of the Baz suite, so every release leaves an "Uploading ...
      # Success!" line in this log. The GitHub Release is created too.
      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          args: -g retail
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
